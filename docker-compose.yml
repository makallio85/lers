# Coolify deploys this compose file. One stateless service: the game as static files behind nginx.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # The commit the game shows on its title screen and in its menu. Coolify injects SOURCE_COMMIT on every
      # build; it must never be listed under `environment:`, which would shadow it with an empty value.
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
    # The tag carries the commit, so the container started is always the build just made.
    image: ${COOLIFY_RESOURCE_UUID:-local}-app:prod-${SOURCE_COMMIT:-local}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 20s
