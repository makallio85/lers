<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#141b18">
  <title>Lers</title>
  <meta name="description" content="Lers: a settlement strategy game. Build an economy, raise an army and take the enemy castle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="game" id="game">
    <aside class="side" id="side">
      <div class="side-head">
        <span class="brand">LERS</span>
        <span class="muted" id="map-name">Sandbox</span>
      </div>
      <canvas class="minimap" id="minimap" width="300" height="180" aria-label="Minimap. Click to move the view; with units selected, right-click to send them there."></canvas>
      <nav class="tabs" id="tabs" aria-label="Game menus"></nav>
      <section class="panel" id="panel" aria-live="polite"></section>
    </aside>

    <main class="stage">
      <header class="topbar">
        <div class="stock" id="stock"></div>
        <div class="controls">
          <span class="muted clock" id="clock">00:00</span>
          <div class="speed" role="group" aria-label="Game speed" id="speed"></div>
          <button type="button" class="menu-button" id="menu-button" data-action="menu" aria-expanded="false" aria-controls="game-menu">Menu</button>
        </div>
      </header>
      <div class="game-menu" id="game-menu" hidden></div>
      <div class="map" id="map"></div>
      <div class="selection" id="selection" hidden></div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="hint" id="hint" hidden></div>
      <div class="orders" id="orders" hidden></div>
      <div class="zoom">
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      </div>
    </main>
  </div>
  <div class="end-screen" id="end-screen" hidden></div>
  <div class="rotate" id="rotate">
    <p>Turn your phone sideways to play.</p>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
